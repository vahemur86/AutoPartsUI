name: Azure Static Web Apps LIVE CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy LIVE

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Vite app
        env:
          VITE_API_BASE_URL: https://prpservice05-g6chfkhxgzducefh.canadacentral-01.azurewebsites.net/api
        run: yarn build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-webapps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_OCEAN_05275CA10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          app_location: "dist"
          app_artifact_location: ""

          skip_app_build: true
          skip_api_build: true
