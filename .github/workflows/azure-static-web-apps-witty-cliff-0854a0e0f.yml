name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Production

  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Production

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Vite app
        env:
          VITE_API_URL: https://prpservice05-g6chfkhxgzducefh.canadacentral-01.azurewebsites.net
        run: yarn build

      - name: Copy Static Web App config
        run: |
          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json dist/
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_CLIFF_0854A0E0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          app_location: "dist"
          app_artifact_location: ""

          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_CLIFF_0854A0E0F }}
          action: close
